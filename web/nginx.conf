# FeedbackIQ web app - nginx inside the web container (Milestone 8).
#
# One origin for the browser: this server hands out the built single-page app AND forwards /api to
# the FastAPI backend. Because the browser never talks to the backend directly, the backend's
# HttpOnly session cookie is first-party and no CORS is involved.
#
#   /api/...    → backend:8000, with the browser's Host header, so the backend's own-origin check
#                 (api/deps.py::check_origin) sees the origin the browser sends
#   /assets/... → hashed build files, cached for a year
#   /healthz    → this container's health, for Docker; says nothing about the backend
#   anything else → index.html, so a deep link such as /imports loads the app

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The API refuses uploads over 10 MB itself, with a message a person can act on. nginx allows a
    # little more so that message gets through, and still stops anything absurd at the edge.
    client_max_body_size 11m;

    # Security headers for every response, including errors ("always"). Location blocks below set
    # no add_header of their own, so they all inherit these.
    #
    # The Content-Security-Policy allows only this origin: the app has no inline scripts or styles,
    # loads its font from its own assets, and calls only /api on the same origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # No Strict-Transport-Security here: this server speaks plain HTTP inside the deployment, and
    # HSTS belongs on whatever terminates TLS in front of it.

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The first request after the backend starts can be slow while it loads.
        proxy_read_timeout 120s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in every asset's file name, so an asset never changes in place.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html names the current assets, so it must never be served from a stale cache.
    location = /index.html {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
