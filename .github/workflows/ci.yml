# CI for FeedbackIQ.
#
# Four jobs, each waiting for the previous one:
#   lint          fast: catches syntax errors and undefined names
#   test          the offline pytest safety net (no models, datasets or API keys needed)
#   db-test       migrations and persistence against a real PostgreSQL service container
#   docker-build  proves both images still build, the real test of "is this deployable"
#
# The rest of the repository (training notebooks, evaluation scripts) needs
# multi-GB data/model files that don't belong in a CI runner, so this pipeline
# deliberately doesn't run them.
#
# Nothing here deploys, pushes an image, or uses secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Lint src, frontend & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      # Checked against real errors only (unused imports, undefined names,
      # syntax errors — the "F" codes plus E9). The rest of this codebase
      # consistently does sys.path.insert() before its imports (needed so
      # scripts run standalone as well as via the package), which trips
      # cosmetic style rules like E402 on every file, not just these ones —
      # so this lint step matches the project's existing convention instead
      # of fighting it.
      - name: Lint src/
        run: flake8 src/ --select=E9,F

      - name: Lint frontend/
        run: flake8 frontend/ --select=E9,F

      # Only the pytest suite; the older manual scripts in tests/ are not linted.
      - name: Lint tests/
        run: flake8 tests/conftest.py tests/unit tests/api tests/integration --select=E9,F

      # The migration scripts are code too, and a typo in one only shows up when
      # someone runs `alembic upgrade` against a real database.
      - name: Lint migrations/
        run: flake8 migrations/ --select=E9,F

  test:
    name: Run pytest
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-extra.txt

      # CPU-only PyTorch first, at the same version requirements.txt pins. The
      # default Linux wheel from PyPI bundles several GB of CUDA libraries that
      # the tests never use. pip then treats `torch==2.13.0` in requirements.txt
      # as already satisfied.
      - name: Install CPU-only PyTorch
        run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      # Installs the package and its pinned runtime dependencies from
      # pyproject.toml, plus the test extras. This also proves `pip install -e .`
      # works in a clean environment.
      - name: Install FeedbackIQ and test dependencies
        run: pip install -e ".[dev]"

      # pytest.ini selects tests/unit and tests/api; tests/conftest.py keeps the
      # run offline (no Hugging Face downloads, no Groq calls) and out of logs/.
      - name: Run pytest
        run: pytest

  db-test:
    name: Run database integration tests
    runs-on: ubuntu-latest
    needs: test

    # A throwaway PostgreSQL for this job only. The credentials below are created by and
    # for this runner, exist for the length of one job, and are unreachable from outside
    # it - no repository secret is involved, and no real database is touched.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without this the test step can start before PostgreSQL accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/integration/conftest.py reads this, creates its own test database from it,
      # and runs the migrations into that database.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Same reason as the test job: the default torch wheel pulls in several GB of CUDA
      # libraries. These tests import the engine's types, not a model.
      - name: Install CPU-only PyTorch
        run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install FeedbackIQ and test dependencies
        run: pip install -e ".[dev]"

      # Proves the migration runs on an empty database outside of pytest as well - the
      # documented deployment step.
      - name: Migrate an empty database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head

      - name: Seed the development data
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python -m feedbackiq.db.seed

      # Not selected by `pytest` on its own (see pyproject.toml), so named explicitly.
      - name: Run database integration tests
        run: pytest tests/integration

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: db-test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: feedbackiq-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: feedbackiq-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Once you have somewhere to push to, add a login step above this and
      # switch push: false to push: true, e.g.:
      #
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
