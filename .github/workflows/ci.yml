# CI for FeedbackIQ.
#
# Three jobs, each waiting for the previous one:
#   lint          fast: catches syntax errors and undefined names
#   test          the offline pytest safety net (no models, datasets or API keys needed)
#   docker-build  proves both images still build, the real test of "is this deployable"
#
# The rest of the repository (training notebooks, evaluation scripts) needs
# multi-GB data/model files that don't belong in a CI runner, so this pipeline
# deliberately doesn't run them.
#
# Nothing here deploys, pushes an image, or uses secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Lint src, frontend & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      # Checked against real errors only (unused imports, undefined names,
      # syntax errors — the "F" codes plus E9). The rest of this codebase
      # consistently does sys.path.insert() before its imports (needed so
      # scripts run standalone as well as via the package), which trips
      # cosmetic style rules like E402 on every file, not just these ones —
      # so this lint step matches the project's existing convention instead
      # of fighting it.
      - name: Lint src/
        run: flake8 src/ --select=E9,F

      - name: Lint frontend/
        run: flake8 frontend/ --select=E9,F

      # Only the pytest suite; the older manual scripts in tests/ are not linted.
      - name: Lint tests/
        run: flake8 tests/conftest.py tests/unit tests/api --select=E9,F

  test:
    name: Run pytest
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-extra.txt

      # CPU-only PyTorch first, at the same version requirements.txt pins. The
      # default Linux wheel from PyPI bundles several GB of CUDA libraries that
      # the tests never use. pip then treats `torch==2.13.0` in requirements.txt
      # as already satisfied.
      - name: Install CPU-only PyTorch
        run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      # Installs the package and its pinned runtime dependencies from
      # pyproject.toml, plus the test extras. This also proves `pip install -e .`
      # works in a clean environment.
      - name: Install FeedbackIQ and test dependencies
        run: pip install -e ".[dev]"

      # pytest.ini selects tests/unit and tests/api; tests/conftest.py keeps the
      # run offline (no Hugging Face downloads, no Groq calls) and out of logs/.
      - name: Run pytest
        run: pytest

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: feedbackiq-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: feedbackiq-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Once you have somewhere to push to, add a login step above this and
      # switch push: false to push: true, e.g.:
      #
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
