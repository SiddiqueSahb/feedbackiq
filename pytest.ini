[pytest]
# FeedbackIQ safety net (Milestone 1). Run from the project root with:  pytest
#
# Only these folders are collected. The older scripts directly inside tests/
# are manual checks, not pytest tests (see tests/conftest.py).
testpaths =
    tests/unit
    tests/api

# Lets tests import project modules (config, nlp, rag, backend) from the
# project root without editing sys.path.
pythonpath = .

# Print a short summary of skipped and expected-failure (known issue) tests.
addopts = -ra
