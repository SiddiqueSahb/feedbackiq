# Runs the FeedbackIQ backend and frontend together.
#
#   docker compose up --build
#
# Backend:  http://localhost:8000  (docs at /docs)
# Frontend: http://localhost:8501
#
# data/, models/, mlruns/ and logs/ are mounted from the host rather than
# copied into the images (see .dockerignore) — they're multiple GB, already
# produced by the existing training/evaluation scripts, and don't belong
# inside a container image that's supposed to just be "the code".
#
# This is also where the future pieces from the roadmap plug in: add a
# `postgres` service (Milestone 4) and point the backend at it, add
# `prometheus`/`grafana` services, etc. — without touching the images themselves.

services:

  # PostgreSQL for local development (Milestone 4). Nothing in the API reads it yet;
  # it exists so migrations, the seed script and the integration tests can run without
  # anyone installing PostgreSQL by hand:
  #
  #   docker compose up -d postgres
  #   alembic upgrade head
  #   python -m feedbackiq.db.seed
  #
  # Published on 55432 to avoid clashing with a PostgreSQL already running on 5432.
  # Credentials are development-only and deliberately in plain sight; a deployed
  # database takes its URL from DATABASE_URL in the environment.
  postgres:
    image: postgres:16-alpine
    container_name: feedbackiq-postgres
    environment:
      - POSTGRES_USER=feedbackiq
      - POSTGRES_PASSWORD=feedbackiq
      - POSTGRES_DB=feedbackiq
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbackiq -d feedbackiq"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # A named volume, not ./something: the database's files are not project files, and
    # bind-mounting them onto macOS/Windows filesystems is both slow and a known source
    # of permission problems.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: feedbackiq-backend
    container_name: feedbackiq-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      # Inside the compose network the database is reachable by service name.
      - DATABASE_URL=postgresql+psycopg://feedbackiq:feedbackiq@postgres:5432/feedbackiq
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./logs:/app/logs
    restart: unless-stopped

  # The background worker (Milestone 5B). Same image as the backend, different command:
  # it claims jobs from the `jobs` table and runs the analytics engine over imported
  # feedback. Analysis deliberately does not happen in the API request.
  #
  #   docker compose up -d postgres worker
  #   docker compose run --rm worker python -m feedbackiq.worker --drain
  #
  # Several replicas are safe - claiming uses SELECT ... FOR UPDATE SKIP LOCKED - but one
  # is plenty here, and each loads its own copy of the models.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: feedbackiq-backend
    container_name: feedbackiq-worker
    command: python -m feedbackiq.worker
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://feedbackiq:feedbackiq@postgres:5432/feedbackiq
    volumes:
      # models/ is mounted because the worker is the process that actually loads them.
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: feedbackiq-frontend
    container_name: feedbackiq-frontend
    ports:
      - "8501:8501"
    env_file:
      # Same file as the backend, so both containers read the same API_KEY.
      # If they disagree the frontend gets 403s from every call.
      - .env
    environment:
      - API_URL=http://backend:8000

    depends_on:
      # Waits for the backend's actual HEALTHCHECK (defined in
      # backend/Dockerfile, hits /api/health) to pass, not just for the
      # container process to start — otherwise the frontend can fire
      # requests before the backend app has finished loading.
      backend:
        condition: service_healthy
    restart: unless-stopped

# Docker manages this one; `docker compose down -v` is what deletes the development
# database. Without `down -v`, restarting compose keeps whatever was migrated and seeded.
volumes:
  postgres-data:
