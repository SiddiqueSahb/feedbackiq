[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedbackiq"
version = "0.1.0"
description = "Customer feedback analytics: sentiment analysis, zero-shot complaint categorisation, semantic search and grounded question answering."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mohammad Asim Siddique" }]

# Runtime dependencies: what the API and the ML code import. Versions are the exact
# pins from requirements.txt - Milestone 2 is structural and changes no versions.
# Deliberately NOT here: mlflow, ragas, bertopic, matplotlib and friends (research
# only, see [project.optional-dependencies].research) and streamlit/plotly/requests
# (the frontend talks to the API over HTTP and is installed separately).
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.0.1",
    "pandas==2.1.4",
    "numpy==1.26.4",
    "pyarrow==15.0.2",
    # scikit-learn is a runtime dependency: the pickled TF-IDF vectoriser and the
    # classical classifiers in models/classical/ cannot be unpickled without it.
    "scikit-learn==1.3.2",
    "torch==2.13.0",
    "transformers==5.14.1",
    "sentence-transformers==5.7.0",
    "faiss-cpu==1.15.0",
    "huggingface-hub==1.26.0",
    "langchain-core==1.5.3",
    "langchain-classic==1.0.8",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.2",
    "langchain-huggingface==1.2.2",
    "langchain-groq==1.1.3",
    "groq==0.37.1",
    # spaCy powers the dashboard's keyword extraction; VADER is a sentiment option
    # and the runtime fallback when the primary model fails.
    "spacy==3.8.14",
    "vaderSentiment==3.3.2",
    # Persistence (Milestone 4). SQLAlchemy and Alembic were already installed but
    # declared nowhere; psycopg is the one genuinely new dependency - PostgreSQL speaks
    # its own wire protocol, and nothing in the existing stack can talk it. The [binary]
    # extra ships a compiled wheel, so no local C toolchain or libpq is needed.
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.2.12",
    # CSV upload (Milestone 5B). FastAPI needs python-multipart to parse multipart/form-data
    # at all - without it an UploadFile endpoint fails at import time. It was already
    # installed in this environment as an undeclared transitive package; declaring it makes
    # the dependency real rather than lucky.
    "python-multipart==0.0.32",
    # Password hashing (Milestone 7). argon2id through the reference Python binding - hashing
    # is never implemented by hand. The one new dependency authentication needs: sessions
    # use the standard library's `secrets` and `hashlib`.
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
# Everything needed to run the test suite and the linter.
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "flake8==7.0.0",
    "httpx==0.28.1",
]

# Dissertation evaluation and the offline pipeline: evaluate/* and scripts/*.
# Not needed to serve a request, and deliberately kept out of the API image.
research = [
    "mlflow==2.12.1",
    "ragas==0.4.3",
    "datasets==4.0.0",
    "bertopic==0.17.4",
    "umap-learn==0.5.12",
    "hdbscan==0.8.44",
    "langdetect==1.0.9",
    "matplotlib==3.8.4",
    "wordcloud==1.9.3",
    "scipy==1.12.0",
    "tqdm==4.70.0",
]

# The Streamlit app. Separate because that image must stay light: no torch,
# no transformers, no faiss.
frontend = [
    "streamlit==1.33.0",
    "plotly==5.20.0",
    "altair==5.3.0",
    "pandas==2.1.4",
    "requests==2.34.2",
    "pydantic==2.10.6",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.0.1",
]

[project.urls]
Repository = "https://github.com/SiddiqueSahb/feedbackiq"

[tool.setuptools.packages.find]
where = ["src"]

# The canonical complaint taxonomy ships with the code. It must be present in a fresh
# clone and inside the container image, because data/ is gitignored research output and
# .dockerignore keeps it out of the image - CI caught the seed silently installing 7
# fallback categories instead of 24 for exactly that reason.
#
# It lives in feedbackiq.core (not feedbackiq.db) because both the analytics engine and
# the database seed read it, and the engine must never import feedbackiq.db.
[tool.setuptools.package-data]
"feedbackiq.core" = ["*.json"]

# Test configuration lives here rather than in a separate pytest.ini, so the
# project has one configuration file. Behaviour is unchanged from Milestone 1,
# except that `pythonpath` is gone: the package is installed with `pip install -e .`,
# so nothing needs to add the project root to sys.path any more.
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/api", "tests/benchmark"]
addopts = "-ra"
markers = [
    "benchmark: measures real model quality; needs the corpus and model files, so it skips when they are absent (including in CI)",
    "integration: needs a real PostgreSQL database (see tests/integration/README or milestone-04.md)",
]

# tests/integration is deliberately NOT in testpaths: those tests need a running
# PostgreSQL, and `pytest` with no arguments must stay runnable by anyone who has only
# cloned the repository. Run them explicitly, as CI does:
#
#   docker compose up -d postgres
#   TEST_DATABASE_URL=postgresql+psycopg://feedbackiq:feedbackiq@localhost:55432/feedbackiq_test \
#       pytest tests/integration
