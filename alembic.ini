; Alembic configuration.
;
;   alembic upgrade head      apply every migration
;   alembic downgrade -1      undo the last one
;   alembic revision --autogenerate -m "what changed"
;
; Note what is NOT here: sqlalchemy.url. The connection string carries a password, so it
; is never written to a file in the repository - migrations/env.py reads it from
; settings.DATABASE_URL (environment or .env) instead.

[alembic]
script_location = migrations

# Migration filenames: <revision>_<slug>.py, e.g. 0001_initial_schema.py. Pass an ordered
# revision id when creating one - `alembic revision --autogenerate --rev-id 0002 -m "..."` -
# so the directory reads in order instead of as a pile of hex hashes.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migration files are UTC.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# INFO so `alembic upgrade` actually says which revisions it applied.
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
